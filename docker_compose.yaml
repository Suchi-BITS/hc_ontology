version: "3.9"

services:

  ollama:
    image: ollama/ollama:latest
    container_name: healthcare-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Optional: docker compose --profile neo4j up
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5.26-community
    container_name: healthcare-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_local}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  api:
    build: .
    container_name: healthcare-api
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_local}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-hcontology}
      OLLAMA_HOST: http://ollama:11434
      OWL_FILE_PATH: healthcare_ontology.owl
      OLLAMA_MODEL: qwen2.5:latest
      EMBEDDING_MODEL: nomic-embed-text:latest
      LOG_LEVEL: INFO
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-10}
      QUERY_DEFAULT_LIMIT: ${QUERY_DEFAULT_LIMIT:-200}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-healthcare-ontology-agents}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      RBAC_ENABLED: ${RBAC_ENABLED:-true}
      GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-true}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      COST_BUDGET_USD_PER_DAY: ${COST_BUDGET_USD_PER_DAY:-25}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  streamlit:
    build: .
    container_name: healthcare-streamlit
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  ollama_data:
  neo4j_data:
