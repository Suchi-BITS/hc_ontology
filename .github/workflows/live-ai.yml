name: Live AI verification (manual)

# Runs the opt-in tests that call the REAL OpenAI API. It is never part of the normal build:
#   * trigger: manual only (workflow_dispatch); it does not run on push or pull request;
#   * the key comes from the repository secret OPENAI_API_KEY, available only to this workflow; give the job an
#     `environment` with required reviewers if you want an approval step before it can read the secret;
#   * LangSmith tracing is forced off, so prompts and answers go to OpenAI only;
#   * cost: a few thousand tokens (see docs/AI_LAYER_LIVE_VERIFICATION.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password-1
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-password-1 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20 --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: python scripts/dev.py setup
      - name: Real OpenAI + Neo4j tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_LIVE_AI: "1"
          RUN_LIVE_NEO4J: "1"
          LANGCHAIN_TRACING_V2: "false"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ci-only-password-1
          NEO4J_DATABASE: neo4j
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "The repository secret OPENAI_API_KEY is not set."; exit 1; fi
          venv/bin/python -m pytest -q -ra -p no:cacheprovider tests/test_ai_live.py tests/test_neo4j_live.py
