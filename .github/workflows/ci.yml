name: CI

# Every job runs a stage of scripts/ci.py, the same command a developer runs locally (`python scripts/ci.py all`),
# so a green build here means the same thing as a green run on a laptop.
# No job uses a real secret, and none can reach OpenAI or LangSmith: the normal build uses the fakes in the test suite.
# Real OpenAI calls live in live-ai.yml, which is manual and secret-controlled.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, no dependencies: secrets, tracked .env/venv, :latest tags, Docker configuration, workflow safety,
  # weak test assertions, and documentation that has gone stale. Fails the build before anything expensive starts.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/ci.py hygiene

  # The fresh-clone path: pinned dependencies, then ontology validation with the OWL reasoner and the whole suite
  # (ontology, reasoner, SHACL, SPARQL, projection, API, security, architecture boundaries, documentation).
  test:
    runs-on: ubuntu-latest
    needs: hygiene
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - uses: actions/setup-java@v4        # the OWL reasoner is part of CI, not an optional extra
        with:
          distribution: temurin
          java-version: "17"
      - name: Install (virtualenv, pinned dependencies, .env from the template)
        run: python scripts/dev.py setup
      - name: Validate, with the reasoner
        run: python scripts/ci.py validate
      - name: Whole test suite
        run: python scripts/ci.py tests

  # A real Neo4j, not a recording fake: load the projection twice, compare the database with the RDF, run the live tests.
  neo4j:
    runs-on: ubuntu-latest
    needs: hygiene
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password-1
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-password-1 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20 --health-start-period 30s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-only-password-1
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: python scripts/dev.py setup
      - name: Projection, idempotence, comparison with the RDF, live Neo4j tests
        run: python scripts/ci.py neo4j

  # The image is built, started and probed: non-root, no secrets baked in, refuses to start unauthenticated, healthy,
  # enforces authentication. The API key used is made up for this job.
  docker:
    runs-on: ubuntu-latest
    needs: hygiene
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/ci.py docker
