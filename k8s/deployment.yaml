# Kubernetes manifests for the API. Assumptions (see docs/security-policy.md, section "Kubernetes"):
#   * The image is built and pushed by .github/workflows/cd.yml. Replace REPLACE_WITH_OWNER and pin the tag
#     (or, better, a digest: image: ...@sha256:<digest>) to the release you deploy. Never use :latest.
#   * The Secret `healthcare-ontology-secrets` is created OUTSIDE this file, for example:
#       kubectl -n healthcare-ontology create secret generic healthcare-ontology-secrets \
#         --from-literal=NEO4J_PASSWORD=... --from-literal=API_KEY=... [--from-literal=OPENAI_API_KEY=...]
#     No Secret object is defined here on purpose: applying a manifest with empty values would overwrite a real one.
#   * ENVIRONMENT=production: the API refuses to start without credentials (API_KEY above). Open development
#     mode is not available here.
#   * Neo4j is assumed to exist as the Service `neo4j` in this namespace. This file does not deploy it.
#   * TLS and authentication at the Ingress are the operator's responsibility; this file only routes.
apiVersion: v1
kind: Namespace
metadata:
  name: healthcare-ontology
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthcare-ontology-config
  namespace: healthcare-ontology
data:
  APP_NAME: "Healthcare Ontology API"
  ENVIRONMENT: "production"
  ALLOW_OPEN_DEVELOPMENT_MODE: "false"
  SPARQL_QUERY_TIMEOUT_SECONDS: "15"
  OPENAI_MODEL: "gpt-4.1-mini"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"
  OPENAI_EMBEDDING_DIMENSIONS: "1536"
  NEO4J_DATABASE: "neo4j"
  # Tracing sends prompts and answers to a third party (LangSmith). Off unless an operator turns it on, together with
  # a LANGCHAIN_API_KEY in the Secret.
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_PROJECT: "healthcare-ontology-agents"
  # Enable only with a collector configured (OTEL_EXPORTER_OTLP_ENDPOINT).
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "healthcare-ontology-api"
  RBAC_ENABLED: "true"
  GUARDRAILS_ENABLED: "true"
  DEFAULT_TENANT_ID: "default"
  AGENT_MAX_RETRIES: "3"
  COST_BUDGET_USD_PER_DAY: "25"
  LLM_RATE_LIMIT_PER_MINUTE: "20"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-api
  namespace: healthcare-ontology
  labels:
    app: healthcare-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-api
  template:
    metadata:
      labels:
        app: healthcare-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/enterprise/metrics"
    spec:
      automountServiceAccountToken: false      # the API never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                       # the `app` user created in the Dockerfile
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/REPLACE_WITH_OWNER/healthcare-ontology-api:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true       # writable paths are the emptyDir mounts below
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: validation-reports
              mountPath: /app/validation_reports
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: healthcare-ontology-config
            - secretRef:
                name: healthcare-ontology-secrets
          env:
            - name: NEO4J_URI
              value: "bolt://neo4j:7687"
            - name: NEO4J_USERNAME
              value: "neo4j"
            - name: ONTOLOGY_SCHEMA_FILE
              value: "ontology/healthcare_schema.ttl"
            - name: SAMPLE_DATA_FILE
              value: "data/sample_data.ttl"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /enterprise/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "256Mi"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: validation-reports
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-api
  namespace: healthcare-ontology
spec:
  selector:
    app: healthcare-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcare-api-hpa
  namespace: healthcare-ontology
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-api-ingress
  namespace: healthcare-ontology
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
    - host: healthcare-ontology.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthcare-api
                port:
                  number: 80
