apiVersion: v1
kind: Namespace
metadata:
  name: healthcare-ontology
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthcare-ontology-config
  namespace: healthcare-ontology
data:
  APP_NAME: "Healthcare Ontology API"
  ENVIRONMENT: "production"
  OLLAMA_MODEL: "qwen2.5:latest"
  EMBEDDING_MODEL: "nomic-embed-text:latest"
  NEO4J_DATABASE: "hcontology"
  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_PROJECT: "healthcare-ontology-agents"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "healthcare-ontology-api"
  RBAC_ENABLED: "true"
  GUARDRAILS_ENABLED: "true"
  DEFAULT_TENANT_ID: "default"
  AGENT_MAX_RETRIES: "3"
  COST_BUDGET_USD_PER_DAY: "25"
  LLM_RATE_LIMIT_PER_MINUTE: "20"
---
apiVersion: v1
kind: Secret
metadata:
  name: healthcare-ontology-secrets
  namespace: healthcare-ontology
type: Opaque
stringData:
  NEO4J_PASSWORD: "change-me"
  API_KEY: ""
  # Set via: kubectl create secret generic ... --from-literal=LANGCHAIN_API_KEY=...
  LANGCHAIN_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-api
  namespace: healthcare-ontology
  labels:
    app: healthcare-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-api
  template:
    metadata:
      labels:
        app: healthcare-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/enterprise/metrics"
    spec:
      containers:
        - name: api
          image: healthcare-ontology-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: healthcare-ontology-config
            - secretRef:
                name: healthcare-ontology-secrets
          env:
            - name: NEO4J_URI
              value: "bolt://neo4j:7687"
            - name: NEO4J_USERNAME
              value: "neo4j"
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: OWL_FILE_PATH
              value: "healthcare_ontology.owl"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /enterprise/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-api
  namespace: healthcare-ontology
spec:
  selector:
    app: healthcare-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcare-api-hpa
  namespace: healthcare-ontology
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthcare-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-api-ingress
  namespace: healthcare-ontology
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
    - host: healthcare-ontology.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthcare-api
                port:
                  number: 80
